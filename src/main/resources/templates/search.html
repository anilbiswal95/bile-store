<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - BikeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-card {
          transition: transform 0.25s;
          border: none;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-card:hover {
          transform: translateY(-4px);
        }
        .btn-primary {
          background-color: #e63946;
          border-color: #e63946;
        }
        .btn-primary:hover {
          background-color: #d62828;
          border-color: #d62828;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-bicycle"></i> BikeStore
        </a>
        <form class="d-flex mx-auto" action="/search" method="get" style="max-width: 400px; width: 100%;">
            <input class="form-control me-2" type="search" name="q" th:value="${query}" placeholder="Search...">
            <button class="btn btn-outline-light" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </form>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="/cart"><i class="bi bi-cart3"></i></a>
            </li>
        </ul>
    </div>
</nav>

<!-- Search Results -->
<div class="container py-4">
    <h4>Search results for: "<span th:text="${query}">query</span>"</h4>
    <p class="text-muted" th:text="${products.totalElements} + ' results found'">0 results</p>

    <div class="row g-4">
        <div th:each="product : ${products.content}" class="col-md-3">
            <div class="card product-card h-100">
                <div class="card-body d-flex flex-column">
                    <h6 th:text="${product.name}">Product</h6>
                    <small class="text-muted" th:text="${product.bikeModel}">Model</small>
                    <div class="mt-auto pt-2">
              <span class="fw-bold text-danger">
                ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span>
              </span>
                    </div>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-outline-dark float-end">View</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
