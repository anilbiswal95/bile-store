<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Modern Font (same as home.html) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #222;
            background: #fff;
        }

        /* Navbar Styling (consistent with home.html) */
        .navbar {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand img {
            height: 48px;
            width: auto;
            background-color: transparent;
            border-radius: 0;
        }

        .navbar-brand span {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f8f9fa;
            letter-spacing: 0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 1.05rem;
            color: #f8f9fa !important;
            transition: color 0.25s ease, transform 0.25s ease;
            padding: .45rem .75rem;
        }

        .navbar-nav .nav-link:hover {
            color: #e63946 !important; /* Accent red */
            transform: translateY(-2px);
        }

        .navbar .btn-outline-light {
            border-color: rgba(255,255,255,0.12);
        }

        /* Search page specific */
        .product-card {
            transition: transform 0.25s;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-card:hover {
            transform: translateY(-4px);
        }

        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
        .btn-primary:hover {
            background-color: #d62828;
            border-color: #d62828;
        }

        .navbar-search {
            max-width: 640px;
            width: 100%;
        }

        @media (max-width: 576px) {
            .navbar-brand img { height: 40px; }
            .navbar-brand span { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <!-- Logo + Brand (use logo.jpg as requested) -->
        <a class="navbar-brand" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <span>BOBBY RIDE CUSTOMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" th:value="${query}" placeholder="Search accessories..." aria-label="Search">
                <button class="btn btn-outline-light" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

                <!-- Show Login if anonymous -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>

                <!-- Show username + dropdown if authenticated -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Search Results -->
<div class="container py-4">
    <h4>Search results for: "<span th:text="${query}">query</span>"</h4>
    <p class="text-muted" th:text="${products.totalElements} + ' results found'">0 results</p>

    <div class="row g-4">
        <div th:each="product : ${products.content}" class="col-md-3">
            <div class="card product-card h-100">
                <div class="card-body d-flex flex-column">
                    <h6 th:text="${product.name}">Product</h6>
                    <small class="text-muted" th:text="${product.bikeModel}">Model</small>
                    <div class="mt-auto pt-2">
                        <span class="fw-bold text-danger">
                            ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span>
                        </span>
                    </div>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-outline-dark float-end">View</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
