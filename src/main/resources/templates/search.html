<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
    <th:block th:replace="~{fragments/brand :: brand-styles}" />
    <th:block th:replace="~{fragments/footer :: footer-styles}" />

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ===== NAVBAR ===== */
        .navbar {
            font-family: 'Inter', sans-serif;
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 10, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 52px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .navbar-brand img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .navbar-brand .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .navbar-brand .brand-main {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-brand .brand-sub {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7) !important;
            transition: var(--transition);
            padding: 0.5rem 1rem !important;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 60%;
        }

        .navbar-nav .nav-link:hover {
            color: var(--text-light) !important;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        .navbar-search .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            transition: var(--transition);
            min-width: 250px;
        }

        .navbar-search .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .navbar-search .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .navbar-search .btn-outline-light {
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: var(--transition);
        }

        .navbar-search .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .dropdown-menu {
            background: var(--dark-gray);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .dropdown-menu .dropdown-item {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropdown-menu .dropdown-item:hover {
            background: rgba(230, 57, 70, 0.1);
            color: var(--text-light);
        }

        .dropdown-menu .dropdown-divider {
            border-color: rgba(255,255,255,0.05);
        }

        /* ===== SEARCH RESULTS ===== */
        .search-header {
            padding: 30px 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }

        .search-header h4 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .search-header .highlight {
            color: var(--primary-light);
        }

        .search-header .result-count {
            color: var(--text-muted);
            font-weight: 300;
        }

        /* ===== PRODUCT CARDS ===== */
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: var(--transition);
            height: 100%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: var(--transition);
            border-radius: var(--border-radius);
        }

        .product-card:hover::before {
            opacity: 0.05;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(230, 57, 70, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .product-card .product-icon {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.1);
            text-align: center;
            display: block;
            margin-bottom: 0.8rem;
            transition: var(--transition);
        }

        .product-card:hover .product-icon {
            color: rgba(230, 57, 70, 0.3);
            transform: scale(1.1) rotate(-5deg);
        }

        .product-card .product-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 0.2rem;
        }

        .product-card .product-model {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .product-card .product-price {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--primary-light);
            font-weight: 600;
        }

        .product-card .btn-detail {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .product-card .btn-detail:hover {
            background: var(--gradient-primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .no-results {
            text-align: center;
            padding: 4rem 0;
        }

        .no-results i {
            font-size: 4rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 1rem;
        }

        .no-results h5 {
            color: var(--text-light);
            font-weight: 600;
        }

        .no-results p {
            color: var(--text-muted);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0,0,0,0.9);
            padding: 3rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 3rem;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar-brand .brand-main {
                font-size: 0.9rem;
            }
            .navbar-brand .brand-sub {
                font-size: 0.45rem;
            }
            .navbar-search .form-control {
                min-width: auto;
            }
            .search-header h4 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='home')}" />

<!-- Search Results Header -->
<div class="container">
    <div class="search-header">
        <h4>
            <i class="bi bi-search"></i> Results for:
            <span class="highlight" th:text="${query}">query</span>
        </h4>
        <p class="result-count" th:text="${products.totalElements} + ' results found'">0 results</p>
    </div>
</div>

<!-- Search Results -->
<div class="container pb-4">
    <div th:if="${products.totalElements > 0}">
        <div class="row g-4">
            <div th:each="product : ${products.content}" class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card">
                    <i class="bi bi-box-seam product-icon"></i>
                    <h6 class="product-title" th:text="${product.name}">Product</h6>
                    <small class="product-model" th:text="${product.bikeModel}">Model</small>
                    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-light border-opacity-10">
                        <span class="product-price">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span></span>
                        <a th:href="@{/products/{id}(id=${product.id})}" class="btn-detail">View <i class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No Results -->
    <div th:if="${products.totalElements == 0}" class="no-results">
        <i class="bi bi-search"></i>
        <h5>No products found</h5>
        <p>We couldn't find any products matching "<span th:text="${query}">query</span>". Try adjusting your search terms.</p>
        <a href="/products" class="btn btn-primary-custom" style="display: inline-block; padding: 0.7rem 2rem; background: var(--gradient-primary); border: none; color: white; border-radius: 50px; font-weight: 600; text-decoration: none; transition: var(--transition); box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);">
            Browse All Products <i class="bi bi-arrow-right ms-2"></i>
        </a>
    </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Product card click
    document.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', function() {
            const link = this.querySelector('.btn-detail');
            if (link) window.location.href = link.getAttribute('href');
        });
    });
</script>
</body>
</html>
