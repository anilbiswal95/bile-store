<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ===== NAVBAR ===== */
        .navbar {
            font-family: 'Inter', sans-serif;
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 10, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 52px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .navbar-brand img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .navbar-brand .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .navbar-brand .brand-main {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-brand .brand-sub {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7) !important;
            transition: var(--transition);
            padding: 0.5rem 1rem !important;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 60%;
        }

        .navbar-nav .nav-link:hover {
            color: var(--text-light) !important;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        .navbar-search .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            transition: var(--transition);
            min-width: 250px;
        }

        .navbar-search .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .navbar-search .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .navbar-search .btn-outline-light {
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: var(--transition);
        }

        .navbar-search .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .dropdown-menu {
            background: var(--dark-gray);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .dropdown-menu .dropdown-item {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropdown-menu .dropdown-item:hover {
            background: rgba(230, 57, 70, 0.1);
            color: var(--text-light);
        }

        .dropdown-menu .dropdown-divider {
            border-color: rgba(255,255,255,0.05);
        }

        /* ===== ERROR CONTENT ===== */
        .error-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            background: radial-gradient(circle at 50% 50%, rgba(230, 57, 70, 0.08) 0%, transparent 60%);
        }

        .error-content {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .error-content .error-icon {
            font-size: 6rem;
            color: var(--primary-light);
            display: block;
            margin-bottom: 1.5rem;
            animation: shake 1.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .error-content h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 0.5rem;
        }

        .error-content .error-code {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: var(--text-muted);
            letter-spacing: 5px;
            margin-bottom: 1rem;
        }

        .error-content p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.4);
            color: white;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0,0,0,0.9);
            padding: 2rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar-brand .brand-main {
                font-size: 0.9rem;
            }
            .navbar-brand .brand-sub {
                font-size: 0.45rem;
            }
            .navbar-search .form-control {
                min-width: auto;
            }
            .error-content h1 {
                font-size: 2.5rem;
            }
            .error-content .error-icon {
                font-size: 4rem;
            }
            .btn-primary-custom {
                padding: 0.6rem 1.5rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 576px) {
            .error-content h1 {
                font-size: 2rem;
            }
            .error-content .error-code {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <div class="brand-text">
                <span class="brand-main">BOBBY RIDE</span>
                <span class="brand-sub">CUSTOMS</span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control" type="search" name="q" placeholder="Search accessories..." aria-label="Search">
                <button class="btn btn-outline-light ms-2" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/products"><i class="bi bi-grid-3x3-gap"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="/orders"><i class="bi bi-receipt me-2"></i>My Orders</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Error Content -->
<section class="error-section">
    <div class="container">
        <div class="error-content">
            <i class="bi bi-exclamation-triangle error-icon"></i>
            <h1>Oops!</h1>
            <div class="error-code">Error</div>
            <p th:text="${message != null ? message : 'Something went wrong. Please try again later.'}">
                Something went wrong. Please try again later.
            </p>
            <a href="/" class="btn btn-primary-custom">
                <i class="bi bi-house me-2"></i> Back to Home
            </a>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
</script>
</body>
</html>
