<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - BOBBY RIDE CUSTOMS'">Product - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ===== IMPORT FRAGMENT STYLES ===== -->
    <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
    <th:block th:replace="~{fragments/brand :: brand-styles}" />
    <th:block th:replace="~{fragments/footer :: footer-styles}" />

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            padding: 20px 0;
            margin-bottom: 0;
        }

        .breadcrumb-item a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .breadcrumb-item a:hover {
            color: var(--primary-light);
        }

        .breadcrumb-item.active {
            color: var(--text-light);
        }

        .breadcrumb-item + .breadcrumb-item::before {
            color: var(--text-muted);
        }

        /* ===== PRODUCT DETAIL ===== */
        .product-image-placeholder {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .product-image-placeholder img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
        }

        .product-image-placeholder i {
            font-size: 8rem;
            color: rgba(255,255,255,0.05);
        }

        .product-detail h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-detail .badge-category {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 400;
            font-size: 0.85rem;
        }

        .product-detail .badge-model {
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary-light);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .product-detail .price {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            color: var(--primary-light);
            font-weight: 700;
        }

        .product-detail .description {
            color: var(--text-muted);
            line-height: 1.8;
            font-weight: 300;
        }

        .product-detail .stock-badge {
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
        }

        .product-detail .stock-badge.in-stock {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }

        .product-detail .stock-badge.out-of-stock {
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary-light);
        }

        .product-detail .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            width: 80px;
        }

        .product-detail .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.4);
            color: white;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .product-detail h2 {
                font-size: 1.6rem;
            }
            .product-detail .price {
                font-size: 2rem;
            }
            .product-image-placeholder {
                padding: 2rem;
                min-height: 250px;
            }
            .product-image-placeholder i {
                font-size: 5rem;
            }
            .product-image-placeholder img {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>

<!-- ===== REPLACE NAVBAR ===== -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='products')}" />

<!-- Breadcrumb -->
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="/products">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}">Product</li>
        </ol>
    </nav>
</div>

<!-- Product Detail -->
<div class="container py-4">
    <div class="row g-4">
        <!-- Product Image -->
        <div class="col-md-5">
            <div class="product-image-placeholder">
                <img th:if="${product.imageUrl != null and product.imageUrl != ''}"
                     th:src="${product.imageUrl}"
                     th:alt="${product.name}"
                     style="width: 100%; height: auto; max-height: 400px; object-fit: contain; border-radius: 12px;">
                <i th:unless="${product.imageUrl != null and product.imageUrl != ''}"
                   class="bi bi-box-seam"></i>
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-md-7 product-detail">
            <h2 th:text="${product.name}">Product Name</h2>
            <div class="mb-3">
                <span class="badge-category me-2" th:text="${product.categoryName}">Category</span>
                <span class="badge-model" th:text="'Fits: ' + ${product.bikeModel}">Model</span>
            </div>

            <div class="price mb-3">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span></div>

            <p class="description" th:text="${product.description}">Description</p>

            <div class="mb-3">
                <span th:if="${product.stock > 0}" class="stock-badge in-stock">
                    <i class="bi bi-check-circle"></i> In Stock (<span th:text="${product.stock}">0</span> available)
                </span>
                <span th:if="${product.stock == 0}" class="stock-badge out-of-stock">
                    <i class="bi bi-x-circle"></i> Out of Stock
                </span>
            </div>

            <div class="d-flex align-items-center gap-3 mt-4" th:if="${product.stock > 0}">
                <input type="number" id="qty" value="1" min="1" th:max="${product.stock}" class="form-control text-center">
                <button class="btn btn-primary-custom" onclick="addToCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== REPLACE FOOTER ===== -->
<th:block th:replace="~{fragments/footer :: footer}" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Add to Cart Script -->
<script th:inline="javascript">
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    const productId = [[${product.id}]];

    function addToCart() {
        const qty = document.getElementById("qty").value;
        fetch("/api/cart/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ productId: productId, quantity: parseInt(qty) })
        })
        .then(res => {
            if (res.ok) {
                alert("Added to cart!");
                window.location.href = "/cart";
            } else if (res.status === 403) {
                window.location.href = "/login";
            } else {
                res.json().then(d => alert(d.message || "Error"));
            }
        });
    }
</script>
</body>
</html>
