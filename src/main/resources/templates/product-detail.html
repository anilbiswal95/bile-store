<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - BikeStore'">Product - BikeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .btn-primary {
          background-color: #e63946;
          border-color: #e63946;
        }
        .btn-primary:hover {
          background-color: #d62828;
          border-color: #d62828;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bicycle"></i> BikeStore</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>
            <li class="nav-item"><a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a></li>
        </ul>
    </div>
</nav>

<!-- Breadcrumb -->
<div class="container py-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="/products">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}">Product</li>
        </ol>
    </nav>

    <div class="row">
        <!-- Product Image -->
        <div class="col-md-5 text-center">
            <div class="bg-light rounded p-5">
                <i class="bi bi-box-seam" style="font-size:8rem;color:#adb5bd;"></i>
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-md-7">
            <h2 th:text="${product.name}">Product Name</h2>
            <span class="badge bg-secondary" th:text="${product.categoryName}">Category</span>
            <span class="badge bg-info text-dark" th:text="'Fits: ' + ${product.bikeModel}">Model</span>

            <h3 class="text-danger mt-3">
                ₹<span th:text="${#numbers.formatDecimal(product.price,1,0)}">0</span>
            </h3>

            <p class="mt-3" th:text="${product.description}">Description</p>

            <p th:if="${product.stock > 0}" class="text-success fw-semibold">
                <i class="bi bi-check-circle"></i> In Stock
                (<span th:text="${product.stock}">0</span> available)
            </p>
            <p th:if="${product.stock == 0}" class="text-danger fw-semibold">
                <i class="bi bi-x-circle"></i> Out of Stock
            </p>

            <div class="d-flex align-items-center gap-3 mt-4" th:if="${product.stock > 0}">
                <input type="number" id="qty" value="1" min="1" th:max="${product.stock}"
                       class="form-control" style="width:80px;">
                <button class="btn btn-primary btn-lg" onclick="addToCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2026 BikeStore. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Add to Cart Script -->
<script th:inline="javascript">
    const productId = [[${product.id}]];

    function addToCart() {
      const qty = document.getElementById("qty").value;
      fetch("/api/cart/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ productId: productId, quantity: parseInt(qty) })
      })
      .then(res => {
        if (res.ok) {
          alert("Added to cart!");
          window.location.href = "/cart";
        } else if (res.status === 403) {
          window.location.href = "/login";
        } else {
          res.json().then(d => alert(d.message || "Error"));
        }
      });
    }
</script>

</body>
</html>
