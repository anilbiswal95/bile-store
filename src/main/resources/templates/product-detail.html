<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - BOBBY RIDE CUSTOMS'">Product - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Modern Font (same as home.html) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Navbar Styling (match home.html) */
        .navbar {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-brand img {
            height: 48px;
            margin-right: 12px;
            background-color: transparent;
            border-radius: 0;
        }

        .navbar-brand span {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f8f9fa;
            letter-spacing: 0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 1.05rem;
            color: #f8f9fa !important;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #e63946 !important; /* Accent red */
            transform: translateY(-2px);
        }

        .navbar-search {
            max-width: 640px;
            width: 100%;
        }

        /* Buttons */
        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
        .btn-primary:hover {
            background-color: #d62828;
            border-color: #d62828;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <!-- Logo + Brand -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <span>BOBBY RIDE CUSTOMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
                <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

                <!-- Show Login if anonymous -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>

                <!-- Show username + dropdown if authenticated -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Breadcrumb -->
<div class="container py-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="/products">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}">Product</li>
        </ol>
    </nav>

    <div class="row">
        <!-- Product Image -->
        <div class="col-md-5 text-center">
            <div class="bg-light rounded p-5">
                <i class="bi bi-box-seam" style="font-size:8rem;color:#adb5bd;"></i>
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-md-7">
            <h2 th:text="${product.name}">Product Name</h2>
            <span class="badge bg-secondary" th:text="${product.categoryName}">Category</span>
            <span class="badge bg-info text-dark" th:text="'Fits: ' + ${product.bikeModel}">Model</span>

            <h3 class="text-danger mt-3">
                ₹<span th:text="${#numbers.formatDecimal(product.price,1,0)}">0</span>
            </h3>

            <p class="mt-3" th:text="${product.description}">Description</p>

            <p th:if="${product.stock > 0}" class="text-success fw-semibold">
                <i class="bi bi-check-circle"></i> In Stock
                (<span th:text="${product.stock}">0</span> available)
            </p>
            <p th:if="${product.stock == 0}" class="text-danger fw-semibold">
                <i class="bi bi-x-circle"></i> Out of Stock
            </p>

            <div class="d-flex align-items-center gap-3 mt-4" th:if="${product.stock > 0}">
                <input type="number" id="qty" value="1" min="1" th:max="${product.stock}"
                       class="form-control" style="width:80px;">
                <button class="btn btn-primary btn-lg" onclick="addToCart()">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Add to Cart Script -->
<script th:inline="javascript">
    const productId = [[${product.id}]];

    function addToCart() {
      const qty = document.getElementById("qty").value;
      fetch("/api/cart/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ productId: productId, quantity: parseInt(qty) })
      })
      .then(res => {
        if (res.ok) {
          alert("Added to cart!");
          window.location.href = "/cart";
        } else if (res.status === 403) {
          window.location.href = "/login";
        } else {
          res.json().then(d => alert(d.message || "Error"));
        }
      });
    }
</script>

</body>
</html>
