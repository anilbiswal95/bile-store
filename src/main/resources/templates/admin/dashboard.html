<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - BikeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bicycle"></i> BikeStore Admin</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="#" onclick="logout()">Logout</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container py-4">
    <h3>Admin Dashboard</h3>

    <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="products-tab-btn" data-bs-toggle="tab" data-bs-target="#products-tab" type="button" role="tab">Products</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="orders-tab-btn" data-bs-toggle="tab" data-bs-target="#orders-tab" type="button" role="tab">Orders</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="products-tab" role="tabpanel">
            <h5>Add Product</h5>
            <form id="productForm" class="row g-3 mb-4">
                <div class="col-md-4">
                    <input type="text" id="pName" class="form-control" placeholder="Name" required>
                </div>
                <div class="col-md-2">
                    <input type="number" id="pPrice" class="form-control" placeholder="Price" required>
                </div>
                <div class="col-md-2">
                    <input type="number" id="pStock" class="form-control" placeholder="Stock" required>
                </div>
                <div class="col-md-2">
                    <input type="number" id="pCatId" class="form-control" placeholder="Category ID" required>
                </div>
                <div class="col-md-2">
                    <input type="text" id="pBike" class="form-control" placeholder="Bike Model">
                </div>
                <div class="col-md-6">
                    <textarea id="pDesc" class="form-control" placeholder="Description"></textarea>
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-2">
                        <input type="checkbox" id="pFeatured" class="form-check-input">
                        <label class="form-check-label" for="pFeatured">Featured</label>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </div>
            </form>

            <div id="product-list"></div>
        </div>

        <div class="tab-pane fade" id="orders-tab" role="tabpanel">
            <div id="admin-orders"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function logout() {
        fetch('/api/auth/logout', { method: 'POST' })
            .then(() => window.location.href = '/')
            .catch(() => window.location.href = '/');
    }

    document.getElementById('productForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const payload = {
            name: document.getElementById('pName').value,
            price: Number(document.getElementById('pPrice').value),
            stock: Number(document.getElementById('pStock').value),
            categoryId: Number(document.getElementById('pCatId').value),
            bikeModel: document.getElementById('pBike').value,
            description: document.getElementById('pDesc').value,
            featured: document.getElementById('pFeatured').checked
        };

        fetch('/api/admin/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(() => {
            alert('Product added successfully');
            loadProducts();
            document.getElementById('productForm').reset();
        })
        .catch(err => {
            console.error(err);
            alert('Failed to add product');
        });
    });

    function loadProducts() {
        fetch('/api/products?size=50')
            .then(r => {
                if (!r.ok) throw new Error('Failed to fetch products');
                return r.json();
            })
            .then(data => {
                const rows = (data.content || []).map(p => `
                    <tr>
                        <td>${p.id ?? ''}</td>
                        <td>${p.name ?? ''}</td>
                        <td>${p.price ?? ''}</td>
                        <td>${p.stock ?? ''}</td>
                        <td>${p.categoryName ?? ''}</td>
                    </tr>`).join('');

                const html = `
                    <table class="table table-sm">
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>`;

                document.getElementById('product-list').innerHTML = html;
            })
            <!--.catch(err => {
                console.error(err);
                document.getElementById('product-list').innerHTML = '<div class="text-danger">Unable to load products.</div>';
            });-->
    }

    // Initial load
    loadProducts();
</script>
</body>
</html>
