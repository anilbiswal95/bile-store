<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Orders - BOBBY RIDE CUSTOMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ===== IMPORT FRAGMENT STYLES ===== -->
    <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
    <th:block th:replace="~{fragments/brand :: brand-styles}" />
    <th:block th:replace="~{fragments/footer :: footer-styles}" />

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --navbar-height: 80px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
            padding-top: var(--navbar-height);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }

        /* ===== PAGE HEADER - FIXED ALIGNMENT ===== */
        .page-wrapper {
            padding-top: 0;
        }

        .page-header {
            padding: 30px 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
            margin-top: 0;
        }

        .page-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 1rem;
            margin-bottom: 0;
        }

        /* ===== ORDERS TABLE ===== */
        .orders-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .table {
            color: var(--text-light);
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1rem 0.5rem;
            white-space: nowrap;
        }

        .table td {
            border-color: rgba(255,255,255,0.05);
            vertical-align: middle;
            padding: 1rem 0.5rem;
        }

        .table tbody tr {
            transition: var(--transition);
        }

        .table tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        .order-status {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .status-confirmed { background: rgba(40, 167, 69, 0.15); color: #28a745; }
        .status-shipped { background: rgba(13, 110, 253, 0.15); color: #0d6efd; }
        .status-delivered { background: rgba(40, 167, 69, 0.15); color: #28a745; }
        .status-cancelled { background: rgba(230, 57, 70, 0.15); color: var(--primary-light); }

        .btn-outline-primary-custom {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--primary-light);
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-outline-primary-custom:hover {
            background: var(--gradient-primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.2);
        }

        .text-primary-light {
            color: var(--primary-light);
            text-decoration: none;
        }

        .text-primary-light:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            :root {
                --navbar-height: 72px;
            }
        }

        @media (max-width: 768px) {
            :root {
                --navbar-height: 64px;
            }
            body {
                padding-top: var(--navbar-height);
            }
            .page-header {
                padding: 20px 0 15px;
            }
            .page-header h2 {
                font-size: 1.5rem;
            }
            .page-header p {
                font-size: 0.9rem;
            }
            .orders-card {
                padding: 1rem;
                overflow-x: auto;
            }
            .table {
                font-size: 0.8rem;
                min-width: 600px;
            }
            .table thead th {
                font-size: 0.7rem;
                padding: 0.75rem 0.4rem;
            }
            .table td {
                padding: 0.75rem 0.4rem;
            }
            .order-status {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .btn-outline-primary-custom {
                font-size: 0.7rem;
                padding: 0.2rem 0.8rem;
            }
        }

        @media (max-width: 576px) {
            :root {
                --navbar-height: 60px;
            }
            body {
                padding-top: var(--navbar-height);
            }
            .page-header h2 {
                font-size: 1.2rem;
            }
            .page-header p {
                font-size: 0.8rem;
            }
            .orders-card {
                padding: 0.75rem;
            }
            .table {
                font-size: 0.7rem;
                min-width: 500px;
            }
            .table thead th {
                font-size: 0.6rem;
                padding: 0.5rem 0.3rem;
                letter-spacing: 0.5px;
            }
            .table td {
                padding: 0.5rem 0.3rem;
            }
            .order-status {
                font-size: 0.55rem;
                padding: 2px 8px;
            }
            .btn-outline-primary-custom {
                font-size: 0.6rem;
                padding: 0.15rem 0.6rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='orders')}" />

<!-- Page Wrapper -->
<div class="page-wrapper">
    <!-- Page Header -->
    <div class="container">
        <div class="page-header">
            <h2><i class="bi bi-receipt"></i> My Orders</h2>
            <p>Review your past orders and their current status</p>
        </div>
    </div>

    <!-- Orders Section -->
    <div class="container pb-4">
        <div class="orders-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Status</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Details</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td>
                            <span class="fw-bold" th:text="${order.orderNumber}">#12345</span>
                        </td>
                        <td>
                            <span th:switch="${order.status}">
                                <span th:case="'PENDING'" class="order-status status-pending" th:text="'Pending'">PENDING</span>
                                <span th:case="'CONFIRMED'" class="order-status status-confirmed" th:text="'Confirmed'">CONFIRMED</span>
                                <span th:case="'SHIPPED'" class="order-status status-shipped" th:text="'Shipped'">SHIPPED</span>
                                <span th:case="'DELIVERED'" class="order-status status-delivered" th:text="'Delivered'">DELIVERED</span>
                                <span th:case="'CANCELLED'" class="order-status status-cancelled" th:text="'Cancelled'">CANCELLED</span>
                                <span th:case="*" class="order-status" th:text="${order.status}">UNKNOWN</span>
                            </span>
                        </td>
                        <td>
                            <span class="fw-semibold" style="color: var(--primary-light);">
                                ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span>
                            </span>
                        </td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy')}">01-01-2026</td>
                        <td>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn-outline-primary-custom">
                                View <i class="bi bi-arrow-right"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="5" class="text-center py-5">
                            <i class="bi bi-receipt" style="font-size: 3rem; display: block; margin-bottom: 1rem; color: var(--text-muted);"></i>
                            <h5 class="text-light">No orders yet</h5>
                            <p class="text-muted">Start shopping to see your orders here.</p>
                            <a href="/products" class="btn btn-primary-custom mt-2" style="display: inline-block; padding: 0.6rem 2rem; background: var(--gradient-primary); border-radius: 50px; color: white; text-decoration: none; font-weight: 600;">
                                <i class="bi bi-shop"></i> Browse Products
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}" />

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===== NAVBAR SCROLL EFFECT =====
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (navbar) {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        }
    });

    // ===== ADD SCROLL CLASS ON LOAD =====
    document.addEventListener('DOMContentLoaded', function() {
        const navbar = document.getElementById('mainNav');
        if (navbar && window.scrollY > 50) {
            navbar.classList.add('scrolled');
        }
    });
</script>

</body>
</html>
