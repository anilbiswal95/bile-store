<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found - BOBBY RIDE CUSTOMS</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Site font (same as home.html) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #e63946;
      --nav-text: #f8f9fa;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      color: #222;
    }

    /* Navbar (consistent with home.html) */
    .navbar {
      background-color: #111 !important;
      font-family: 'Poppins', sans-serif;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-brand img {
      height: 48px;
      width: auto;
      background-color: transparent;
      border-radius: 0;
      margin-right: 8px;
    }

    .navbar-brand .brand-text {
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--nav-text);
      letter-spacing: 0.5px;
    }

    .navbar-nav .nav-link {
      font-weight: 500;
      font-size: 1.05rem;
      color: var(--nav-text) !important;
      transition: color 0.25s ease, transform 0.25s ease;
      padding: .45rem .75rem;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent) !important;
      transform: translateY(-2px);
    }

    .navbar-search {
      max-width: 640px;
      width: 100%;
    }

    /* Page content */
    .notfound {
      padding: 100px 0;
      text-align: center;
    }

    .notfound .display-4 {
      font-weight: 600;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background-color: #d62828;
      border-color: #d62828;
    }

    @media (max-width: 576px) {
      .navbar-brand img { height: 40px; }
      .navbar-brand .brand-text { font-size: 1.05rem; }
      .notfound { padding: 60px 0; }
    }
  </style>
</head>
<body>

<!-- Navbar (same look as home.html; logo filename is logo.jpg) -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
      <span class="brand-text">BOBBY RIDE CUSTOMS</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
        <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
        <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
      </form>

      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
        </li>

        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="principal.fullName"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="/profile">Profile</a></li>
            <li><a class="dropdown-item" href="/logout">Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Not Found Content -->
<main class="notfound">
  <div class="container py-5">
    <h1 class="display-4">Product not found</h1>
    <p class="lead text-muted" th:text="${message}">The product you requested does not exist.</p>
    <a href="/" class="btn btn-primary mt-3">Back to Home</a>
  </div>
</main>

<!-- Footer (consistent with site) -->
<footer class="bg-dark text-light py-4 mt-5">
  <div class="container text-center">
    <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
