<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeStore - Premium Motorcycle Accessories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hero {
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                        url('/images/image1.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0;
            margin-bottom: 2rem;
        }
        .product-card, .category-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }
        .product-card:hover, .category-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }
        .product-icon {
            font-size: 3rem;
            color: #0d6efd;
        }
        .category-icon {
            font-size: 2rem;
            color: #0d6efd;
        }
        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
        /* constrain search width on large screens but allow full width on small screens */
        .navbar-search {
            max-width: 640px;
            width: 100%;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-bicycle"></i> BikeStore</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
                <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item"><a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <h1 class="display-4 fw-bold">Premium Motorcycle Accessories</h1>
        <p class="lead mt-3">Panniers, crash guards, lighting &amp; more for your adventure bike</p>
        <a href="/products" class="btn btn-primary btn-lg mt-3">Shop Now</a>
    </div>
</section>

<!-- Featured Products -->
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-4">Featured Products</h2>

        <div class="row g-4">
            <div th:each="product : ${featured}" class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="card product-card h-100">
                    <div class="card-body d-flex flex-column align-items-center text-center">
                        <div class="mb-3">
                            <i class="bi bi-box-seam product-icon" aria-hidden="true"></i>
                        </div>
                        <h6 class="card-title" th:text="${product.name}">Product Name</h6>
                        <p class="card-text text-muted mb-3">
                            <span class="fw-semibold text-primary" th:text="${product.price}">$0.00</span>
                        </p>
                        <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary mt-auto w-100">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Categories -->
<section class="py-5 bg-light">
    <div class="container">
        <h2 class="text-center mb-4">Shop by Category</h2>

        <div class="row g-3 justify-content-center">
            <div th:each="cat : ${categories}" class="col-6 col-sm-4 col-md-3 col-lg-2">
                <a th:href="@{/products?category={id}(id=${cat.id})}" class="text-decoration-none">
                    <div class="card category-card h-100 text-center">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <i class="bi bi-gear-wide-connected category-icon" aria-hidden="true"></i>
                            <p class="mt-2 mb-0 fw-semibold text-dark" th:text="${cat.name}">Category</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2026 BikeStore. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
