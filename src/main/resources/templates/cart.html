<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - BikeStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        .btn-primary {
        background-color: #e63946;
        border-color: #e63946;
        }

        .btn-primary:hover {
        background-color: #d62839;
        border-color: #d62839;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-bicycle"></i> BikeStore
        </a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="/products">Products</a>
            </li>
        </ul>

    </div>
</nav>

<div class="container py-4">

    <h3>
        <i class="bi bi-cart3"></i> Your Cart
    </h3>

    <div id="cart-content">
        <p class="text-muted">Loading...</p>
    </div>

</div>

<script>

    function loadCart() {

    fetch('/api/cart')
    .then(r => {

    if (r.status === 403) {
    window.location.href = '/login';
    return;
    }

    return r.json();
    })
    .then(cart => {

    if (!cart || cart.items.length === 0) {

    document.getElementById('cart-content').innerHTML =
    '<p>Your cart is empty. <a href="/products">Continue shopping</a></p>';

    return;
    }

    let html =
    '<table class="table">' +
    '<thead>' +
    '<tr>' +
    '<th>Product</th>' +
    '<th>Price</th>' +
    '<th>Qty</th>' +
    '<th>Subtotal</th>' +
    '<th></th>' +
    '</tr>' +
    '</thead>' +
    '<tbody>';

    cart.items.forEach(item => {

    html +=
    `<tr>
    <td>${item.productName}</td>

    <td>₹${item.price}</td>

    <td>
    <input
    type="number"
    value="${item.quantity}"
    min="1"
    style="width: 60px"
    onchange="updateQty(${item.productId}, this.value)">
    </td>

    <td>₹${item.subtotal}</td>

    <td>
    <button
    class="btn btn-sm btn-danger"
    onclick="removeItem(${item.productId})">

    <i class="bi bi-trash"></i>
    </button>
    </td>
    </tr>`;
    });

    html +=
    `</tbody>
    </table>

    <div class="text-end">

    <h4>Total: ₹${cart.total}</h4>

    <button
    class="btn btn-primary btn-lg mt-2"
    onclick="checkout()">

    Proceed to Checkout
    </button>

    </div>`;

    document.getElementById('cart-content').innerHTML = html;

    });
    }

    function updateQty(productId, qty) {

    fetch(`/api/cart/update/${productId}?quantity=${qty}`, {
    method: 'PUT'
    }).then(() => loadCart());
    }

    function removeItem(productId) {

    fetch(`/api/cart/remove/${productId}`, {
    method: 'DELETE'
    }).then(() => loadCart());
    }

    function checkout() {

    const address = prompt('Enter shipping address:');

    if (!address) return;

    fetch('/api/orders', {
    method: 'POST',
    headers: {
    'Content-Type': 'application/json'
    },
    body: JSON.stringify({
    shippingAddress: address,
    paymentMethod: 'COD'
    })
    })
    .then(r => r.json())
    .then(order => {

    alert('Order placed! Order #' + order.orderNumber);

    window.location.href = '/orders';
    });
    }

    loadCart();

</script>

</body>
</html>
