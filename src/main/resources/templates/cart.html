<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Modern Font (same as home.html) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        /* Navbar Styling (match home.html) */
        .navbar {
            font-family: 'Poppins', sans-serif;
        }

        .navbar-brand img {
            height: 48px;
            margin-right: 12px;
            background-color: transparent;
            border-radius: 0;
        }

        .navbar-brand span {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f8f9fa;
            letter-spacing: 0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 1.05rem;
            color: #f8f9fa !important;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #e63946 !important; /* Accent red */
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                        url('/images/image1.jpg');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            margin-bottom: 2rem;
        }

        /* Cart card */
        .cart-card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* Buttons */
        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
        .btn-primary:hover {
            background-color: #d62828;
            border-color: #d62828;
        }

        /* Table */
        .table thead th {
            border-bottom: 2px solid rgba(0,0,0,0.06);
        }

        .input-group .btn {
            min-width: 36px;
        }

        /* constrain search width on large screens but allow full width on small screens */
        .navbar-search {
            max-width: 640px;
            width: 100%;
        }

        @media (max-width: 576px) {
            .navbar-brand img { height: 40px; }
            .navbar-brand span { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<!-- Navbar (same look as home.html) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <!-- Logo + Brand -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <span>BOBBY RIDE CUSTOMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
                <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link active" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

                <!-- Show Login if anonymous -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>

                <!-- Show username + dropdown if authenticated -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <h1 class="display-4 fw-bold"><i class="bi bi-cart3"></i> Your Cart</h1>
        <p class="lead mt-3">Review your selected products and proceed to checkout</p>
    </div>
</section>

<!-- Cart Content -->
<section class="py-5">
    <div class="container">
        <div class="card cart-card p-4">
            <div id="cart-content">
                <p class="text-muted">Loading...</p>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script>
    function loadCart() {
        fetch('/api/cart')
            .then(r => {
                if (r.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                return r.json();
            })
            .then(cart => {
                if (!cart || cart.items.length === 0) {
                    document.getElementById('cart-content').innerHTML =
                        '<p>Your cart is empty. <a href="/products">Continue shopping</a></p>';
                    return;
                }

                let html =
                    '<table class="table table-striped align-middle">' +
                    '<thead>' +
                    '<tr>' +
                    '<th>Product</th>' +
                    '<th>Price</th>' +
                    '<th style="width:160px">Qty</th>' +
                    '<th>Subtotal</th>' +
                    '<th>Action</th>' +
                    '</tr>' +
                    '</thead>' +
                    '<tbody>';

                cart.items.forEach(item => {
                    html +=
                        `<tr>
                            <td>${item.productName}</td>
                            <td>₹${item.price}</td>
                            <td>
                                <div class="input-group" style="width:140px">
                                    <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${item.productId}, ${item.quantity - 1})">-</button>
                                    <input type="number" class="form-control text-center" value="${item.quantity}" min="1"
                                           onchange="updateQty(${item.productId}, this.value)">
                                    <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td>₹${item.subtotal}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="removeItem(${item.productId})">
                                    <i class="bi bi-trash"></i> Remove
                                </button>
                            </td>
                        </tr>`;
                });

                html +=
                    `</tbody>
                    </table>
                    <div class="text-end">
                        <h4>Total: ₹${cart.total}</h4>
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a href="/products" class="btn btn-outline-secondary">Continue Shopping</a>
                            <button class="btn btn-primary btn-lg" onclick="checkout()">Proceed to Checkout</button>
                        </div>
                    </div>`;

                document.getElementById('cart-content').innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('cart-content').innerHTML = '<p class="text-danger">Failed to load cart. Try again later.</p>';
            });
    }

    function updateQty(productId, qty) {
        qty = parseInt(qty);
        if (isNaN(qty) || qty < 1) return;
        fetch(`/api/cart/update/${productId}?quantity=${qty}`, { method: 'PUT' })
            .then(() => loadCart());
    }

    function removeItem(productId) {
        fetch(`/api/cart/remove/${productId}`, { method: 'DELETE' })
            .then(() => loadCart());
    }

    function checkout() {
        const address = prompt('Enter shipping address:');
        if (!address) return;

        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ shippingAddress: address, paymentMethod: 'COD' })
        })
        .then(r => r.json())
        .then(order => {
            alert('Order placed! Order #' + order.orderNumber);
            window.location.href = '/orders';
        })
        .catch(() => alert('Failed to place order. Try again.'));
    }

    loadCart();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
