<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ===== NAVBAR ===== */
        .navbar {
            font-family: 'Inter', sans-serif;
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 10, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 52px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .navbar-brand img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .navbar-brand .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .navbar-brand .brand-main {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-brand .brand-sub {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7) !important;
            transition: var(--transition);
            padding: 0.5rem 1rem !important;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 60%;
        }

        .navbar-nav .nav-link:hover {
            color: var(--text-light) !important;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        .navbar-search .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            transition: var(--transition);
            min-width: 250px;
        }

        .navbar-search .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .navbar-search .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .navbar-search .btn-outline-light {
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: var(--transition);
        }

        .navbar-search .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)),
                        url('/images/image1.jpg');
            background-size: cover;
            background-position: center;
            padding: 80px 0;
            margin-bottom: 2rem;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, var(--dark), transparent);
        }

        .hero .container {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            color: rgba(255,255,255,0.8);
            font-weight: 300;
        }

        /* ===== CART CARD ===== */
        .cart-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            padding: 2rem;
        }

        .table {
            color: var(--text-light);
        }

        .table thead th {
            border-bottom: 2px solid rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table td {
            border-color: rgba(255,255,255,0.05);
            vertical-align: middle;
            padding: 1rem 0.5rem;
        }

        .table .btn-outline-secondary {
            color: var(--text-muted);
            border-color: rgba(255,255,255,0.1);
        }

        .table .btn-outline-secondary:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .table .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.4);
            color: white;
        }

        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-light);
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-outline-custom:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--primary);
            color: var(--text-light);
            transform: translateY(-3px);
        }

        .total-amount {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            color: var(--primary-light);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0,0,0,0.9);
            padding: 3rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 3rem;
        }

        .footer .footer-brand {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }
            .navbar-brand .brand-main {
                font-size: 0.9rem;
            }
            .navbar-brand .brand-sub {
                font-size: 0.45rem;
            }
            .navbar-search .form-control {
                min-width: auto;
            }
            .cart-card {
                padding: 1rem;
            }
            .table {
                font-size: 0.85rem;
            }
            .total-amount {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .hero {
                padding: 50px 0;
            }
            .hero h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <div class="brand-text">
                <span class="brand-main">BOBBY RIDE</span>
                <span class="brand-sub">CUSTOMS</span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control" type="search" name="q" placeholder="Search accessories..." aria-label="Search">
                <button class="btn btn-outline-light ms-2" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/products"><i class="bi bi-grid-3x3-gap"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link active" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="container text-center">
        <h1><i class="bi bi-cart3"></i> Your Cart</h1>
        <p class="lead mt-3">Review your selected products and proceed to checkout</p>
    </div>
</section>

<!-- Cart Content -->
<section class="py-4">
    <div class="container">
        <div class="cart-card">
            <div id="cart-content">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading your cart...</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container text-center">
        <span class="footer-brand">BOBBY RIDE CUSTOMS</span>
        <p class="mt-2 mb-0">© 2026 Premium Motorcycle Accessories</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true, offset: 50 });

    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    });

    function loadCart() {
        fetch('/api/cart')
            .then(r => {
                if (r.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                return r.json();
            })
            .then(cart => {
                if (!cart || cart.items.length === 0) {
                    document.getElementById('cart-content').innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-cart-x" style="font-size: 4rem; color: var(--text-muted);"></i>
                            <p class="mt-3 text-muted">Your cart is empty.</p>
                            <a href="/products" class="btn btn-primary-custom">Continue Shopping</a>
                        </div>
                    `;
                    return;
                }

                let html = `
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th style="width:160px">Quantity</th>
                                    <th>Subtotal</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                cart.items.forEach(item => {
                    html += `
                        <tr>
                            <td><strong>${item.productName}</strong></td>
                            <td>₹${item.price}</td>
                            <td>
                                <div class="input-group" style="width:140px">
                                    <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${item.productId}, ${item.quantity - 1})">-</button>
                                    <input type="number" class="form-control text-center" value="${item.quantity}" min="1"
                                           onchange="updateQty(${item.productId}, this.value)">
                                    <button class="btn btn-outline-secondary btn-sm" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td>₹${item.subtotal}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="removeItem(${item.productId})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                    <div class="text-end mt-4">
                        <h4>Total: <span class="total-amount">₹${cart.total}</span></h4>
                        <div class="d-flex justify-content-end gap-2 mt-3 flex-wrap">
                            <a href="/products" class="btn btn-outline-custom">Continue Shopping</a>
                            <button class="btn btn-primary-custom" onclick="checkout()">Proceed to Checkout <i class="bi bi-arrow-right ms-2"></i></button>
                        </div>
                    </div>
                `;

                document.getElementById('cart-content').innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('cart-content').innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: var(--primary);"></i>
                        <p class="mt-3 text-danger">Failed to load cart. Try again later.</p>
                        <button class="btn btn-primary-custom" onclick="loadCart()">Retry</button>
                    </div>
                `;
            });
    }

    function updateQty(productId, qty) {
        qty = parseInt(qty);
        if (isNaN(qty) || qty < 1) return;
        fetch(`/api/cart/update/${productId}?quantity=${qty}`, { method: 'PUT' })
            .then(() => loadCart());
    }

    function removeItem(productId) {
        if (confirm('Remove this item from cart?')) {
            fetch(`/api/cart/remove/${productId}`, { method: 'DELETE' })
                .then(() => loadCart());
        }
    }

    function checkout() {
        const address = prompt('Enter shipping address:');
        if (!address) return;

        fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ shippingAddress: address, paymentMethod: 'COD' })
        })
        .then(r => r.json())
        .then(order => {
            alert('Order placed! Order #' + order.orderNumber);
            window.location.href = '/orders';
        })
        .catch(() => alert('Failed to place order. Try again.'));
    }

    loadCart();
</script>
</body>
</html>
