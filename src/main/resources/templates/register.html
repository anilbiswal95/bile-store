<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
    <th:block th:replace="~{fragments/brand :: brand-styles}" />
    <th:block th:replace="~{fragments/footer :: footer-styles}" />

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ===== NAVBAR ===== */
        .navbar {
            font-family: 'Inter', sans-serif;
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 10, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 52px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .navbar-brand img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .navbar-brand .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .navbar-brand .brand-main {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-brand .brand-sub {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7) !important;
            transition: var(--transition);
            padding: 0.5rem 1rem !important;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 60%;
        }

        .navbar-nav .nav-link:hover {
            color: var(--text-light) !important;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        .navbar-search .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            transition: var(--transition);
            min-width: 250px;
        }

        .navbar-search .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .navbar-search .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .navbar-search .btn-outline-light {
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: var(--transition);
        }

        .navbar-search .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .dropdown-menu {
            background: var(--dark-gray);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .dropdown-menu .dropdown-item {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropdown-menu .dropdown-item:hover {
            background: rgba(230, 57, 70, 0.1);
            color: var(--text-light);
        }

        .dropdown-menu .dropdown-divider {
            border-color: rgba(255,255,255,0.05);
        }

        /* ===== REGISTER SECTION ===== */
        .register-section {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 80px 0;
            background: radial-gradient(circle at 70% 50%, rgba(230, 57, 70, 0.05) 0%, transparent 60%);
        }

        .register-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .register-card h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-card .form-label {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .register-card .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            transition: var(--transition);
        }

        .register-card .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .register-card .form-control::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .register-card .alert-danger {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.2);
            color: var(--primary-light);
            border-radius: 12px;
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.3);
            width: 100%;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.4);
            color: white;
        }

        .register-card a {
            color: var(--primary-light);
            text-decoration: none;
            transition: var(--transition);
        }

        .register-card a:hover {
            color: var(--text-light);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0,0,0,0.9);
            padding: 2rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: auto;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar-brand .brand-main {
                font-size: 0.9rem;
            }
            .navbar-brand .brand-sub {
                font-size: 0.45rem;
            }
            .navbar-search .form-control {
                min-width: auto;
            }
            .register-card {
                padding: 1.5rem;
            }
            .register-card h3 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='home')}" />

<!-- Register Section -->
<section class="register-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="register-card">
                    <h3 class="text-center mb-4">Create Account</h3>

                    <div id="error" class="alert alert-danger d-none"></div>

                    <form id="registerForm" method="post" action="/register">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text" id="mobile" name="mobile" class="form-control" placeholder="Enter your mobile number" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary-custom">Register <i class="bi bi-arrow-right ms-2"></i></button>
                    </form>

                    <p class="text-center mt-3 text-muted">
                        Already have an account? <a href="/login">Login</a>
                    </p>
                    <div class="text-center mt-2">
                        <a href="/" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Navbar scroll effect
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Registration form handler
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            mobile: document.getElementById('mobile').value,
            password: document.getElementById('password').value
        };

        fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(r => {
            if (r.ok) return r.json();
            return r.json().then(d => { throw new Error(d.message || 'Registration failed'); });
        })
        .then(() => {
            window.location.href = '/';
        })
        .catch(err => {
            const el = document.getElementById('error');
            el.textContent = err.message;
            el.classList.remove('d-none');
        });
    });
</script>
</body>
</html>
