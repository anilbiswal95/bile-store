<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Modern Font (same as home.html) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #222;
        }

        /* Navbar Styling (match home.html) */
        .navbar {
            font-family: 'Poppins', sans-serif;
            background-color: #111 !important;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand img {
            height: 48px;
            width: auto;
            background: transparent;
            border-radius: 0;
        }

        .navbar-brand span {
            font-weight: 600;
            font-size: 1.3rem;
            color: #f8f9fa;
            letter-spacing: 0.5px;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 1.05rem;
            color: #f8f9fa !important;
            transition: color 0.25s ease, transform 0.25s ease;
            padding: .45rem .75rem;
        }

        .navbar-nav .nav-link:hover {
            color: #e63946 !important; /* Accent red */
            transform: translateY(-2px);
        }

        .navbar .btn-outline-light {
            border-color: rgba(255,255,255,0.12);
        }

        .navbar-search {
            max-width: 640px;
            width: 100%;
        }

        /* Card / Form */
        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .btn-primary {
            background-color: #e63946;
            border-color: #e63946;
        }
        .btn-primary:hover {
            background-color: #d62828;
            border-color: #d62828;
        }

        .form-control:focus {
            border-color: #e63946;
            box-shadow: 0 0 0 0.2rem rgba(230,57,70,0.12);
        }

        @media (max-width: 576px) {
            .navbar-brand img { height: 40px; }
            .navbar-brand span { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<!-- Navbar (consistent with home.html; logo file is logo.jpg) -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <!-- Logo + Brand -->
        <a class="navbar-brand" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <span>BOBBY RIDE CUSTOMS</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
                <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

                <!-- Show Login if anonymous -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>

                <!-- Show username + dropdown if authenticated -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile">Profile</a></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Register Section -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center mt-3">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Create an account</h3>

                        <div id="error" class="alert alert-danger d-none"></div>

                        <form id="registerForm" method="post" action="/register">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="fullName" name="fullName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mobile</label>
                                <input type="text" id="mobile" name="mobile" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>

                        <p class="text-center mt-3">Already have an account? <a href="/login">Login</a></p>
                        <div class="text-center mt-2">
                            <a href="/" class="text-decoration-none">← Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer (match site) -->
<footer class="bg-dark text-light py-4 mt-4">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script>
    // Keep existing client-side registration behavior; adjust endpoint if needed.
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const payload = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        mobile: document.getElementById('mobile').value,
        password: document.getElementById('password').value
      };

      fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      })
      .then(r => {
        if (r.ok) return r.json();
        return r.json().then(d => { throw new Error(d.message || 'Registration failed'); });
      })
      .then(() => {
        window.location.href = '/';
      })
      .catch(err => {
        const el = document.getElementById('error');
        el.textContent = err.message;
        el.classList.remove('d-none');
      });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
