<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BikeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-primary {
          background-color: #e63946;
          border-color: #e63946;
        }
        .btn-primary:hover {
          background-color: #d62828;
          border-color: #d62828;
        }
    </style>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Register</h3>
                    <div id="error" class="alert alert-danger d-none"></div>
                    <form id="registerForm" method="post" action="/api/auth/register">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="fullName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile</label>
                            <input type="text" id="mobile" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                    <p class="text-center mt-3">Already have an account? <a href="/login">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script -->
<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          fullName: document.getElementById('fullName').value,
          email: document.getElementById('email').value,
          mobile: document.getElementById('mobile').value,
          password: document.getElementById('password').value
        })
      })
      .then(r => {
        if (r.ok) return r.json();
        return r.json().then(d => { throw new Error(d.message || 'Registration failed'); });
      })
      .then(() => {
        window.location.href = '/';
      })
      .catch(err => {
        document.getElementById('error').textContent = err.message;
        document.getElementById('error').classList.remove('d-none');
      });
    });
</script>
</body>
</html>
