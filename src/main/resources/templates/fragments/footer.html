<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>

<!-- ===== FOOTER FRAGMENT ===== -->
<!-- Usage: <th:block th:replace="~{fragments/footer :: footer}" /> -->

<footer class="footer" th:fragment="footer">
  <div class="container">
    <div class="row align-items-center">
      <!-- Brand Info - Left -->
      <div class="col-md-4 text-center text-md-start">
        <span class="footer-brand">BOBBY RIDE CUSTOMS</span>
        <p class="mt-2 mb-0 footer-tagline">Premium Motorcycle Accessories</p>
      </div>

      <!-- Social Links - Center -->
      <div class="col-md-4 text-center">
        <div class="social-links">
          <a th:href="${socialInstagram}" target="_blank" th:if="${socialInstagram}" class="social-instagram">
            <i class="bi bi-instagram"></i>
          </a>
          <a th:href="${socialYouTube}" target="_blank" th:if="${socialYouTube}" class="social-youtube">
            <i class="bi bi-youtube"></i>
          </a>
          <a th:href="${socialFacebook}" target="_blank" th:if="${socialFacebook}" class="social-facebook">
            <i class="bi bi-facebook"></i>
          </a>
          <a th:href="${socialTwitter}" target="_blank" th:if="${socialTwitter}" class="social-twitter">
            <i class="bi bi-twitter-x"></i>
          </a>
        </div>
      </div>

      <!-- Copyright - Right -->
      <div class="col-md-4 text-center text-md-end">
        <p class="mb-0 footer-copyright">© 2026 All Rights Reserved</p>
      </div>
    </div>
  </div>
</footer>

<!-- ===== FOOTER STYLES ===== -->
<th:block th:fragment="footer-styles">
  <style>
    .footer {
      background: rgba(0,0,0,0.9);
      padding: 3rem 0;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 3rem;
    }

    .footer .footer-brand {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #e63946 0%, #c62835 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer .footer-tagline {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .footer .footer-copyright {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* ===== SOCIAL ICONS WITH BRAND COLORS ===== */
    .footer .social-links a {
      font-size: 1.5rem;
      margin: 0 12px;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: inline-block;
      text-decoration: none;
      position: relative;
    }

    /* Instagram - Gradient */
    .footer .social-links .social-instagram {
      color: #E4405F;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer .social-links .social-instagram:hover {
      transform: scale(1.2) translateY(-3px);
      filter: drop-shadow(0 4px 15px rgba(225, 48, 108, 0.4));
    }

    /* YouTube - Red */
    .footer .social-links .social-youtube {
      color: #FF0000;
    }

    .footer .social-links .social-youtube:hover {
      color: #FF0000;
      transform: scale(1.2) translateY(-3px);
      filter: drop-shadow(0 4px 15px rgba(255, 0, 0, 0.4));
    }

    /* Facebook - Blue */
    .footer .social-links .social-facebook {
      color: #1877F2;
    }

    .footer .social-links .social-facebook:hover {
      color: #1877F2;
      transform: scale(1.2) translateY(-3px);
      filter: drop-shadow(0 4px 15px rgba(24, 119, 242, 0.4));
    }

    /* Twitter/X - Black/White */
    .footer .social-links .social-twitter {
      color: #000000;
      background: #ffffff;
      border-radius: 50%;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      font-size: 1rem;
      margin: 0 2px;
    }

    .footer .social-links .social-twitter i {
      -webkit-text-fill-color: #000000;
    }

    .footer .social-links .social-twitter:hover {
      transform: scale(1.2) translateY(-3px);
      filter: drop-shadow(0 4px 15px rgba(255, 255, 255, 0.3));
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .footer {
        padding: 2.5rem 0;
      }
      .footer .footer-brand {
        font-size: 1rem;
      }
      .footer .footer-tagline {
        font-size: 0.8rem;
      }
      .footer .footer-copyright {
        font-size: 0.8rem;
      }
      .footer .social-links a {
        font-size: 1.3rem;
        margin: 0 8px;
      }
      .footer .social-links .social-twitter {
        width: 1.3rem;
        height: 1.3rem;
        font-size: 0.85rem;
      }
      .footer .row > div {
        margin-bottom: 1rem;
      }
      .footer .row > div:last-child {
        margin-bottom: 0;
      }
    }

    @media (max-width: 576px) {
      .footer {
        padding: 2rem 0;
      }
      .footer .social-links a {
        font-size: 1.1rem;
        margin: 0 6px;
      }
      .footer .social-links .social-twitter {
        width: 1.1rem;
        height: 1.1rem;
        font-size: 0.7rem;
      }
      .footer .footer-brand {
        font-size: 0.9rem;
      }
      .footer .footer-tagline,
      .footer .footer-copyright {
        font-size: 0.75rem;
      }
    }
  </style>
</th:block>

</body>
</html>
