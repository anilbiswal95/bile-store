<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
</head>
<body>

<!-- ===== NAVBAR FRAGMENT ===== -->
<!-- Usage: <th:block th:replace="~{fragments/navbar :: navbar(activePage='home')}" /> -->
<!-- activePage options: 'home', 'products', 'cart', 'login', 'profile', 'orders' -->

<nav class="navbar navbar-expand-lg fixed-top" id="mainNav" th:fragment="navbar(activePage)">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="/images/logo.jpg" th:alt="${brandName} + ' Logo'">
      <!-- Dynamic brand rendering based on context -->
      <th:block th:replace="~{fragments/brand :: brand-full}" />
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
        <input class="form-control" type="search" name="q" placeholder="Search accessories..." aria-label="Search">
        <button class="btn btn-outline-light ms-2" type="submit">
          <i class="bi bi-search"></i>
        </button>
      </form>

      <ul class="navbar-nav ms-auto">
        <!-- Products -->
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activePage == 'products'} ? 'active'" href="/products">
            <i class="bi bi-grid-3x3-gap"></i> Products
          </a>
        </li>

        <!-- Cart -->
        <li class="nav-item">
          <a class="nav-link" th:classappend="${activePage == 'cart'} ? 'active'" href="/cart">
            <i class="bi bi-cart3"></i> Cart
          </a>
        </li>

        <!-- Login (Anonymous) -->
        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" th:classappend="${activePage == 'login'} ? 'active'" href="/login">
            <i class="bi bi-person"></i> Login
          </a>
        </li>

        <!-- User Dropdown (Authenticated) -->
        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="principal.fullName"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" th:classappend="${activePage == 'profile'} ? 'active'" href="/profile">
                <i class="bi bi-person me-2"></i>Profile
              </a>
            </li>
            <li>
              <a class="dropdown-item" th:classappend="${activePage == 'orders'} ? 'active'" href="/orders">
                <i class="bi bi-receipt me-2"></i>My Orders
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ===== NAVBAR STYLES ===== -->
<th:block th:fragment="navbar-styles">
  <style>
    .navbar {
        font-family: 'Inter', sans-serif;
        background: rgba(10, 10, 10, 0.95) !important;
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding: 0.8rem 0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .navbar.scrolled {
        background: rgba(10, 10, 10, 0.98) !important;
        box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        padding: 0;
    }

    .navbar-brand img {
        height: 52px;
        border-radius: 12px;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .navbar-brand img:hover {
        transform: scale(1.05) rotate(-3deg);
    }

    .navbar-brand .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1;
    }

    .navbar-nav .nav-link {
        font-weight: 500;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.7) !important;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        padding: 0.5rem 1rem !important;
        position: relative;
    }

    .navbar-nav .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: linear-gradient(135deg, #e63946 0%, #c62835 100%);
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after,
    .navbar-nav .nav-link.active::after {
        width: 60%;
    }

    .navbar-nav .nav-link:hover {
        color: #ffffff !important;
    }

    .navbar-nav .nav-link i {
        margin-right: 6px;
        font-size: 1.1rem;
    }

    .navbar-search .form-control {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        color: #ffffff;
        border-radius: 50px;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        min-width: 250px;
    }

    .navbar-search .form-control:focus {
        background: rgba(255,255,255,0.12);
        border-color: #e63946;
        box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
    }

    .navbar-search .form-control::placeholder {
        color: rgba(255,255,255,0.4);
    }

    .navbar-search .btn-outline-light {
        border-radius: 50px;
        padding: 0.6rem 1.2rem;
        border-color: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.7);
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .navbar-search .btn-outline-light:hover {
        background: #e63946;
        border-color: #e63946;
        color: white;
    }

    .dropdown-menu {
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.06);
    }

    .dropdown-menu .dropdown-item {
        color: #b0b0b0;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .dropdown-menu .dropdown-item:hover {
        background: rgba(230, 57, 70, 0.1);
        color: #ffffff;
    }

    .dropdown-menu .dropdown-divider {
        border-color: rgba(255,255,255,0.05);
    }

    /* Responsive */
    @media (max-width: 992px) {
        .navbar-brand img {
            height: 44px;
        }
    }

    @media (max-width: 768px) {
        .navbar-brand img {
            height: 40px;
        }
        .navbar-search .form-control {
            min-width: auto;
        }
    }

    @media (max-width: 576px) {
        .navbar-brand img {
            height: 35px;
        }
        .navbar-brand {
            gap: 10px;
        }
    }
  </style>
</th:block>

</body>
</html>
