<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ===== IMPORT FRAGMENT STYLES ===== -->
    <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
    <th:block th:replace="~{fragments/brand :: brand-styles}" />
    <th:block th:replace="~{fragments/footer :: footer-styles}" />

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }

        /* ===== PRODUCTS ===== */
        .products-header {
            padding: 30px 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }

        .products-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== FILTERS ===== */
        .filter-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 90px;
        }

        .filter-card h5 {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
        }

        .filter-card .form-label {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .filter-card .form-select,
        .filter-card .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            transition: var(--transition);
        }

        .filter-card .form-select:focus,
        .filter-card .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .filter-card .form-select option {
            background: var(--dark);
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.6rem;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.2);
            width: 100%;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.3);
            color: white;
        }

        /* ===== PRODUCT CARDS ===== */
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1rem;
            transition: var(--transition);
            height: 100%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: var(--transition);
            border-radius: var(--border-radius);
        }

        .product-card:hover::before {
            opacity: 0.05;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(230, 57, 70, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .product-card .product-image {
            width: 100%;
            height: 180px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            overflow: hidden;
            position: relative;
        }

        .product-card .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            transition: var(--transition);
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-card .product-image .product-icon {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.1);
            transition: var(--transition);
        }

        .product-card:hover .product-image .product-icon {
            color: rgba(230, 57, 70, 0.3);
            transform: scale(1.1) rotate(-5deg);
        }

        .product-card .product-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 0.2rem;
        }

        .product-card .product-model {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .product-card .product-price {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--primary-light);
            font-weight: 600;
        }

        .product-card .btn-detail {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .product-card:hover .btn-detail {
            background: var(--gradient-primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* ===== PAGINATION ===== */
        .pagination .page-link {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            transition: var(--transition);
            border-radius: 8px;
            margin: 0 3px;
        }

        .pagination .page-link:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .pagination .page-item.disabled .page-link {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.05);
            color: var(--text-muted);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .filter-card {
                position: relative;
                top: 0;
                margin-bottom: 1.5rem;
            }
            .products-header h3 {
                font-size: 1.5rem;
            }
            .product-card .product-image {
                height: 140px;
            }
        }

        @media (max-width: 576px) {
            .product-card .product-image {
                height: 120px;
            }
        }
    </style>
</head>
<body>

<!-- ===== REPLACE NAVBAR ===== -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='products')}" />

<!-- Products Header -->
<div class="container">
    <div class="products-header">
        <h3><i class="bi bi-grid-3x3-gap"></i> All Products</h3>
    </div>
</div>

<!-- Main Content -->
<div class="container pb-4">
    <div class="row">
        <!-- Filters -->
        <div class="col-md-3">
            <div class="filter-card">
                <h5>Filters</h5>
                <form action="/products" method="get">
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="categoryId" class="form-select">
                            <option value="">All</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.id == selectedCategory}">Category</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bike Model</label>
                        <select name="bikeModel" class="form-select">
                            <option value="">All</option>
                            <option th:each="bm : ${bikeModels}"
                                    th:value="${bm}"
                                    th:text="${bm}"
                                    th:selected="${bm == selectedBikeModel}">Model</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Min Price</label>
                        <input type="number" name="minPrice" class="form-control" placeholder="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Max Price</label>
                        <input type="number" name="maxPrice" class="form-control" placeholder="10000">
                    </div>
                    <button type="submit" class="btn btn-primary-custom">Apply Filters</button>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="col-md-9">
            <div class="row g-4">
                <div th:each="product : ${products.content}" class="col-md-4">
                    <a th:href="@{/products/{id}(id=${product.id})}" class="product-card">
                        <div class="product-image">
                            <img th:if="${product.imageUrl != null and product.imageUrl != ''}"
                                 th:src="${product.imageUrl}"
                                 th:alt="${product.name}">
                            <i th:unless="${product.imageUrl != null and product.imageUrl != ''}"
                               class="bi bi-box-seam product-icon"></i>
                        </div>
                        <h6 class="product-title" th:text="${product.name}">Product</h6>
                        <small class="product-model" th:text="${product.bikeModel}">Model</small>
                        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-light border-opacity-10">
                            <span class="product-price">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span></span>
                            <span class="btn-detail">View <i class="bi bi-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Pagination -->
            <nav class="mt-4" th:if="${products.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.page == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.page - 1}, categoryId=${selectedCategory}, bikeModel=${selectedBikeModel})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.page + 1}, categoryId=${selectedCategory}, bikeModel=${selectedBikeModel})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- ===== REPLACE FOOTER ===== -->
<th:block th:replace="~{fragments/footer :: footer}" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===== NAVBAR SCROLL EFFECT =====
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
</script>
</body>
</html>
