<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - BOBBY RIDE CUSTOMS</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c62835;
            --primary-light: #ff6b7a;
            --dark: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #ffffff;
            --text-muted: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
            --border-radius: 16px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }

        /* ===== NAVBAR ===== */
        .navbar {
            font-family: 'Inter', sans-serif;
            background: rgba(10, 10, 10, 0.95) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 0.8rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            background: rgba(10, 10, 10, 0.98) !important;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .navbar-brand img {
            height: 52px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .navbar-brand img:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .navbar-brand .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .navbar-brand .brand-main {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-brand .brand-sub {
            font-size: 0.55rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7) !important;
            transition: var(--transition);
            padding: 0.5rem 1rem !important;
            position: relative;
        }

        .navbar-nav .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gradient-primary);
            transition: var(--transition);
            transform: translateX(-50%);
        }

        .navbar-nav .nav-link:hover::after,
        .navbar-nav .nav-link.active::after {
            width: 60%;
        }

        .navbar-nav .nav-link:hover {
            color: var(--text-light) !important;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        .navbar-search .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            transition: var(--transition);
            min-width: 250px;
        }

        .navbar-search .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .navbar-search .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .navbar-search .btn-outline-light {
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
            transition: var(--transition);
        }

        .navbar-search .btn-outline-light:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .dropdown-menu {
            background: var(--dark-gray);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .dropdown-menu .dropdown-item {
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropdown-menu .dropdown-item:hover {
            background: rgba(230, 57, 70, 0.1);
            color: var(--text-light);
        }

        .dropdown-menu .dropdown-divider {
            border-color: rgba(255,255,255,0.05);
        }

        /* ===== PRODUCTS ===== */
        .products-header {
            padding: 30px 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 2rem;
        }

        .products-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== FILTERS ===== */
        .filter-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 90px;
        }

        .filter-card h5 {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 1.2rem;
            letter-spacing: 1px;
        }

        .filter-card .form-label {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .filter-card .form-select,
        .filter-card .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            transition: var(--transition);
        }

        .filter-card .form-select:focus,
        .filter-card .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
        }

        .filter-card .form-select option {
            background: var(--dark);
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            padding: 0.6rem;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.2);
            width: 100%;
        }

        .btn-primary-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(230, 57, 70, 0.3);
            color: white;
        }

        /* ===== PRODUCT CARDS ===== */
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: var(--transition);
            height: 100%;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--gradient-primary);
            opacity: 0;
            transition: var(--transition);
            border-radius: var(--border-radius);
        }

        .product-card:hover::before {
            opacity: 0.05;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(230, 57, 70, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .product-card .product-icon {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.1);
            text-align: center;
            display: block;
            margin-bottom: 0.8rem;
            transition: var(--transition);
        }

        .product-card:hover .product-icon {
            color: rgba(230, 57, 70, 0.3);
            transform: scale(1.1) rotate(-5deg);
        }

        .product-card .product-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 0.2rem;
        }

        .product-card .product-model {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .product-card .product-price {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: var(--primary-light);
            font-weight: 600;
        }

        .product-card .btn-detail {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            pointer-events: auto;
            position: relative;
            z-index: 2;
        }

        .product-card .btn-detail:hover {
            background: var(--gradient-primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* ===== PAGINATION ===== */
        .pagination .page-link {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-light);
            transition: var(--transition);
            border-radius: 8px;
            margin: 0 3px;
        }

        .pagination .page-link:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .pagination .page-item.disabled .page-link {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.05);
            color: var(--text-muted);
        }

        /* ===== FOOTER ===== */
        .footer {
            background: rgba(0,0,0,0.9);
            padding: 3rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 3rem;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar-brand .brand-main {
                font-size: 0.9rem;
            }
            .navbar-brand .brand-sub {
                font-size: 0.45rem;
            }
            .navbar-search .form-control {
                min-width: auto;
            }
            .filter-card {
                position: relative;
                top: 0;
                margin-bottom: 1.5rem;
            }
            .products-header h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
            <div class="brand-text">
                <span class="brand-main">BOBBY RIDE</span>
                <span class="brand-sub">CUSTOMS</span>
            </div>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
                <input class="form-control" type="search" name="q" placeholder="Search accessories..." aria-label="Search">
                <button class="btn btn-outline-light ms-2" type="submit"><i class="bi bi-search"></i></button>
            </form>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/products"><i class="bi bi-grid-3x3-gap"></i> Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="principal.fullName"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="/orders"><i class="bi bi-receipt me-2"></i>My Orders</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Products Header -->
<div class="container">
    <div class="products-header">
        <h3><i class="bi bi-grid-3x3-gap"></i> All Products</h3>
    </div>
</div>

<!-- Main Content -->
<div class="container pb-4">
    <div class="row">
        <!-- Filters -->
        <div class="col-md-3">
            <div class="filter-card">
                <h5>Filters</h5>
                <form action="/products" method="get">
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="categoryId" class="form-select">
                            <option value="">All</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"
                                    th:selected="${cat.id == selectedCategory}">Category</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bike Model</label>
                        <select name="bikeModel" class="form-select">
                            <option value="">All</option>
                            <option th:each="bm : ${bikeModels}"
                                    th:value="${bm}"
                                    th:text="${bm}"
                                    th:selected="${bm == selectedBikeModel}">Model</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Min Price</label>
                        <input type="number" name="minPrice" class="form-control" placeholder="0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Max Price</label>
                        <input type="number" name="maxPrice" class="form-control" placeholder="10000">
                    </div>
                    <button type="submit" class="btn btn-primary-custom">Apply Filters</button>
                </form>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="col-md-9">
            <div class="row g-4">
                <!-- CHANGED: Wrapped each product card in an <a> tag for proper navigation -->
                <div th:each="product : ${products.content}" class="col-md-4">
                    <a th:href="@{/products/{id}(id=${product.id})}" class="product-card">
                        <i class="bi bi-box-seam product-icon"></i>
                        <h6 class="product-title" th:text="${product.name}">Product</h6>
                        <small class="product-model" th:text="${product.bikeModel}">Model</small>
                        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-light border-opacity-10">
                            <span class="product-price">₹<span th:text="${#numbers.formatDecimal(product.price, 1, 0)}">0</span></span>
                            <span class="btn-detail">View <i class="bi bi-arrow-right"></i></span>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Pagination -->
            <nav class="mt-4" th:if="${products.totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${products.page == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.page - 1}, categoryId=${selectedCategory}, bikeModel=${selectedBikeModel})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/products(page=${products.page + 1}, categoryId=${selectedCategory}, bikeModel=${selectedBikeModel})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container text-center">
        <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===== NAVBAR SCROLL EFFECT =====
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('mainNav');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });
</script>
</body>
</html>
