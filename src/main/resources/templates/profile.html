<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - BOBBY RIDE CUSTOMS</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Modern Font (same as home.html) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #e63946;
      --nav-text: #f8f9fa;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #222;
      background: #fff;
    }

    .navbar {
      font-family: 'Poppins', sans-serif;
      background-color: #111 !important;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-brand img {
      height: 48px;
      width: auto;
      background: transparent;
      border-radius: 0;
    }

    .navbar-brand span {
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--nav-text);
      letter-spacing: 0.5px;
    }

    .navbar-nav .nav-link {
      font-weight: 500;
      font-size: 1.05rem;
      color: var(--nav-text) !important;
      transition: color 0.25s ease, transform 0.25s ease;
      padding: .45rem .75rem;
    }

    .navbar-nav .nav-link:hover {
      color: var(--accent) !important;
      transform: translateY(-2px);
    }

    .navbar .btn-outline-light {
      border-color: rgba(255,255,255,0.12);
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                  url('/images/image1.jpg');
      background-size: cover;
      background-position: center;
      color: white;
      padding: 80px 0;
      margin-bottom: 2rem;
    }

    .profile-card {
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background-color: #d62828;
      border-color: #d62828;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(230,57,70,0.12);
    }

    .navbar-search {
      max-width: 640px;
      width: 100%;
    }

    @media (max-width: 576px) {
      .navbar-brand img { height: 40px; }
      .navbar-brand span { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="/images/logo.jpg" alt="BOBBY RIDE CUSTOMS Logo">
      <span>BOBBY RIDE CUSTOMS</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <form class="d-flex mx-auto navbar-search" action="/search" method="get" role="search">
        <input class="form-control me-2" type="search" name="q" placeholder="Search accessories..." aria-label="Search" />
        <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
      </form>

      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3"></i> Cart</a></li>

        <li class="nav-item" sec:authorize="isAnonymous()">
          <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
        </li>

        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle"></i>
            <span sec:authentication="principal.fullName"></span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="/profile">Profile</a></li>
            <li><a class="dropdown-item" href="/orders">My Orders</a></li>
            <li><a class="dropdown-item" href="/logout">Logout</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="container text-center">
    <h1 class="display-4 fw-bold">
      Welcome to Your Profile - <span th:text="${user.fullName}"></span>
    </h1>
    <p class="lead mt-3">Manage your account details and addresses</p>
  </div>
</section>

<!-- Profile Content -->
<section class="py-5">
  <div class="container">
    <div class="row g-4">
      <!-- Profile Info -->
      <div class="col-md-6">
        <div class="card profile-card p-4">
          <h3 class="mb-4">User Information</h3>
          <form th:action="@{/profile/update}" method="post">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" th:value="${user.email}" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" name="fullName" th:value="${user.fullName}">
            </div>
            <div class="mb-3">
              <label class="form-label">Mobile</label>
              <input type="text" class="form-control" name="mobile" th:value="${user.mobile}">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary w-100">Update Profile</button>
              <!-- View Orders button -->
              <a th:href="@{/orders}" class="btn btn-outline-primary w-100">My Orders</a>
            </div>
          </form>
        </div>
      </div>

      <!-- Address Info -->
      <div class="col-md-6">
        <div class="card profile-card p-4">
          <h3 class="mb-4">Addresses</h3>
          <div th:each="addr : ${addresses}">
            <p class="mb-2">
              <strong th:text="${addr.street}"></strong>,
              <span th:text="${addr.city}"></span>,
              <span th:text="${addr.state}"></span> -
              <span th:text="${addr.pinCode}"></span>
            </p>
          </div>

          <form th:action="@{/profile/address}" method="post" class="mt-3">
            <div class="mb-2"><input type="text" class="form-control" name="street" placeholder="Street"></div>
            <div class="mb-2"><input type="text" class="form-control" name="city" placeholder="City"></div>
            <div class="mb-2"><input type="text" class="form-control" name="state" placeholder="State"></div>
            <div class="mb-2"><input type="text" class="form-control" name="pinCode" placeholder="Pin Code"></div>
            <button type="submit" class="btn btn-primary w-100">Add Address</button>
          </form>

          <div class="mt-3">
            <!-- Secondary link to orders for convenience -->
            <!--<a th:href="@{/orders}" class="btn btn-outline-primary w-100">See Your Orders</a>-->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-light py-4 mt-5">
  <div class="container text-center">
    <p class="mb-0">© 2026 BOBBY RIDE CUSTOMS. Premium Motorcycle Accessories.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
