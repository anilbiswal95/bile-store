<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - BOBBY RIDE CUSTOMS</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ===== IMPORT FRAGMENT STYLES ===== -->
  <th:block th:replace="~{fragments/navbar :: navbar-styles}" />
  <th:block th:replace="~{fragments/brand :: brand-styles}" />
  <th:block th:replace="~{fragments/footer :: footer-styles}" />

  <style>
    :root {
        --primary: #e63946;
        --primary-dark: #c62835;
        --primary-light: #ff6b7a;
        --dark: #0a0a0a;
        --dark-gray: #1a1a1a;
        --text-light: #ffffff;
        --text-muted: #b0b0b0;
        --gradient-primary: linear-gradient(135deg, #e63946 0%, #c62835 100%);
        --border-radius: 16px;
        --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--dark);
        color: var(--text-light);
        overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--gradient-primary); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

    /* ===== NAVBAR ===== */
    .navbar {
        font-family: 'Inter', sans-serif;
        background: rgba(10, 10, 10, 0.95) !important;
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.05);
        padding: 0.8rem 0;
        transition: var(--transition);
    }

    .navbar.scrolled {
        background: rgba(10, 10, 10, 0.98) !important;
        box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    .navbar-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
    }

    .navbar-brand img {
        height: 52px;
        border-radius: 12px;
        transition: var(--transition);
    }

    .navbar-brand img:hover {
        transform: scale(1.05) rotate(-3deg);
    }

    .navbar-brand .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
    }

    .navbar-brand .brand-main {
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        font-size: 1.1rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .navbar-brand .brand-sub {
        font-size: 0.55rem;
        font-weight: 300;
        letter-spacing: 3px;
        color: var(--text-muted);
        -webkit-text-fill-color: var(--text-muted);
    }

    .navbar-nav .nav-link {
        font-weight: 500;
        font-size: 0.95rem;
        color: rgba(255,255,255,0.7) !important;
        transition: var(--transition);
        padding: 0.5rem 1rem !important;
        position: relative;
    }

    .navbar-nav .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--gradient-primary);
        transition: var(--transition);
        transform: translateX(-50%);
    }

    .navbar-nav .nav-link:hover::after,
    .navbar-nav .nav-link.active::after {
        width: 60%;
    }

    .navbar-nav .nav-link:hover {
        color: var(--text-light) !important;
    }

    .navbar-nav .nav-link i {
        margin-right: 6px;
    }

    .navbar-search .form-control {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-light);
        border-radius: 50px;
        padding: 0.6rem 1.2rem;
        font-size: 0.9rem;
        transition: var(--transition);
        min-width: 250px;
    }

    .navbar-search .form-control:focus {
        background: rgba(255,255,255,0.12);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
    }

    .navbar-search .form-control::placeholder {
        color: rgba(255,255,255,0.4);
    }

    .navbar-search .btn-outline-light {
        border-radius: 50px;
        padding: 0.6rem 1.2rem;
        border-color: rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.7);
        transition: var(--transition);
    }

    .navbar-search .btn-outline-light:hover {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    .dropdown-menu {
        background: var(--dark-gray);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .dropdown-menu .dropdown-item {
        color: var(--text-muted);
        transition: var(--transition);
    }

    .dropdown-menu .dropdown-item:hover {
        background: rgba(230, 57, 70, 0.1);
        color: var(--text-light);
    }

    .dropdown-menu .dropdown-divider {
        border-color: rgba(255,255,255,0.05);
    }

    /* ===== HERO ===== */
    .hero {
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)),
                    url('/images/image1.jpg');
        background-size: cover;
        background-position: center;
        padding: 80px 0;
        margin-bottom: 2rem;
        position: relative;
        margin-top: 20px;
    }

    .hero::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(to top, var(--dark), transparent);
    }

    .hero .container {
        position: relative;
        z-index: 2;
    }

    .hero h1 {
        font-family: 'Orbitron', monospace;
        font-size: 2.8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ffffff 0%, #e63946 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .hero .lead {
        color: rgba(255,255,255,0.8);
        font-weight: 300;
    }

    /* ===== PROFILE CARDS ===== */
    .profile-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: var(--border-radius);
        padding: 2rem;
        backdrop-filter: blur(10px);
        height: 100%;
        transition: var(--transition);
    }

    .profile-card:hover {
        border-color: rgba(230, 57, 70, 0.2);
    }

    .profile-card h3 {
        font-family: 'Orbitron', monospace;
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--text-light);
        margin-bottom: 1.5rem;
        letter-spacing: 1px;
    }

    .profile-card .form-label {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.85rem;
    }

    .profile-card .form-control {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-light);
        border-radius: 12px;
        padding: 0.7rem 1rem;
        transition: var(--transition);
    }

    .profile-card .form-control:focus {
        background: rgba(255,255,255,0.08);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
    }

    .profile-card .form-control:read-only {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .profile-card .form-control::placeholder {
        color: rgba(255,255,255,0.3);
    }

    .profile-card .info-row {
        display: flex;
        justify-content: space-between;
        padding: 0.8rem 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .profile-card .info-row:last-child {
        border-bottom: none;
    }

    .profile-card .info-label {
        color: var(--text-muted);
        font-weight: 400;
    }

    .profile-card .info-value {
        color: var(--text-light);
        font-weight: 500;
    }

    /* Toast notifications */
    .toast-container {
        position: fixed;
        top: 80px;
        right: 20px;
        z-index: 9999;
    }

    .toast {
        background: rgba(20, 20, 20, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: var(--border-radius);
        box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .toast .toast-body {
        color: var(--text-light);
    }

    .toast.bg-success .toast-body {
        color: #28a745;
    }

    .toast.bg-danger .toast-body {
        color: var(--primary-light);
    }

    .btn-primary-custom {
        background: var(--gradient-primary);
        border: none;
        color: white;
        padding: 0.7rem;
        border-radius: 50px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: var(--transition);
        box-shadow: 0 8px 30px rgba(230, 57, 70, 0.2);
        width: 100%;
    }

    .btn-primary-custom:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(230, 57, 70, 0.3);
        color: white;
    }

    .btn-outline-custom {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--text-light);
        padding: 0.7rem;
        border-radius: 50px;
        font-weight: 500;
        font-size: 0.95rem;
        transition: var(--transition);
        width: 100%;
    }

    .btn-outline-custom:hover {
        background: rgba(255,255,255,0.05);
        border-color: var(--primary);
        color: var(--text-light);
        transform: translateY(-3px);
    }

    .btn-success-custom {
        background: #28a745;
        border: none;
        color: white;
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        font-weight: 500;
        font-size: 0.8rem;
        transition: var(--transition);
    }

    .btn-success-custom:hover {
        background: #1e7e34;
        transform: translateY(-2px);
        color: white;
    }

    .btn-danger-custom {
        background: #dc3545;
        border: none;
        color: white;
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        font-weight: 500;
        font-size: 0.8rem;
        transition: var(--transition);
    }

    .btn-danger-custom:hover {
        background: #bd2130;
        transform: translateY(-2px);
        color: white;
    }

    .profile-card .address-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 0.8rem;
        transition: var(--transition);
    }

    .profile-card .address-item:hover {
        border-color: rgba(230, 57, 70, 0.2);
    }

    .profile-card .address-item p {
        color: var(--text-light);
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }

    .profile-card .address-item .address-actions {
        display: flex;
        gap: 8px;
        margin-top: 0.5rem;
    }

    .profile-card .address-item .address-label {
        color: var(--text-muted);
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    /* ===== EDIT ADDRESS MODAL ===== */
    .modal-content {
        background: var(--dark-gray);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: var(--border-radius);
    }

    .modal-header {
        border-bottom: 1px solid rgba(255,255,255,0.06);
        padding: 1.5rem;
    }

    .modal-header .modal-title {
        font-family: 'Orbitron', monospace;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-light);
    }

    .modal-header .btn-close {
        filter: invert(1) brightness(2);
        opacity: 0.6;
    }

    .modal-header .btn-close:hover {
        opacity: 1;
    }

    .modal-body {
        padding: 1.5rem;
    }

    .modal-footer {
        border-top: 1px solid rgba(255,255,255,0.06);
        padding: 1rem 1.5rem;
    }

    /* ===== FOOTER ===== */
    .footer {
        background: rgba(0,0,0,0.9);
        padding: 3rem 0;
        border-top: 1px solid rgba(255,255,255,0.05);
        margin-top: 3rem;
    }

    .footer p {
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 300;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
        .navbar-brand .brand-main {
            font-size: 0.9rem;
        }
        .navbar-brand .brand-sub {
            font-size: 0.45rem;
        }
        .navbar-search .form-control {
            min-width: auto;
        }
        .hero h1 {
            font-size: 2rem;
        }
        .profile-card {
            padding: 1.5rem;
        }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar(activePage='home')}" />

<!-- Toast Container -->
<div class="toast-container"></div>

<!-- Hero -->
<section class="hero">
  <div class="container text-center">
    <h1>Welcome Back, <span th:text="${user.fullName}"></span></h1>
    <p class="lead mt-3">Manage your account details and addresses</p>
  </div>
</section>

<!-- Profile Content -->
<section class="py-4">
  <div class="container">
    <div class="row g-4">
      <!-- Profile Info - Read Only -->
      <div class="col-md-6">
        <div class="profile-card">
          <h3><i class="bi bi-person"></i> User Information</h3>

          <div class="info-row">
            <span class="info-label">Email</span>
            <span class="info-value" th:text="${user.email}"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Full Name</span>
            <span class="info-value" th:text="${user.fullName}"></span>
          </div>
          <div class="info-row">
            <span class="info-label">Mobile</span>
            <span class="info-value" th:text="${user.mobile}"></span>
          </div>

          <div class="d-grid gap-2 mt-3">
            <a th:href="@{/orders}" class="btn btn-outline-custom">My Orders</a>
          </div>
        </div>
      </div>

      <!-- Address Info -->
      <div class="col-md-6">
        <div class="profile-card">
          <h3><i class="bi bi-geo-alt"></i> Addresses</h3>

          <div id="addressesContainer">
            <div th:each="addr : ${addresses}" class="address-item" th:data-address-id="${addr.id}">
              <p>
                <strong th:text="${addr.street}"></strong><br>
                <span th:text="${addr.city}"></span>,
                <span th:text="${addr.state}"></span> -
                <span th:text="${addr.pinCode}"></span>
              </p>
              <div class="d-flex justify-content-between align-items-center">
                                <span class="address-label" th:if="${addr.default}">
                                    <i class="bi bi-check-circle-fill" style="color: #28a745;"></i> Default Address
                                </span>
                <div class="address-actions">
                  <button class="btn btn-success-custom" th:onclick="'editAddress(' + ${addr.id} + ')'">
                    <i class="bi bi-pencil"></i> Edit
                  </button>
                  <button class="btn btn-danger-custom" th:onclick="'deleteAddress(' + ${addr.id} + ')'">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
            <div th:if="${#lists.isEmpty(addresses)}" class="text-muted text-center py-3">
              <i class="bi bi-geo-alt" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;"></i>
              No addresses saved yet.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== EDIT ADDRESS MODAL ===== -->
<div class="modal fade" id="editAddressModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Edit Address</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editAddressForm">
          <input type="hidden" id="editAddressId">
          <div class="mb-3">
            <label class="form-label">Street Address</label>
            <input type="text" id="editStreet" class="form-control" placeholder="Street address" required>
          </div>
          <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" id="editCity" class="form-control" placeholder="City" required>
          </div>
          <div class="mb-3">
            <label class="form-label">State</label>
            <input type="text" id="editState" class="form-control" placeholder="State" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Pin Code</label>
            <!-- CHANGED: Added onkeyup event and keypress validation -->
            <input type="text" id="editPinCode" class="form-control" placeholder="Enter 6-digit pincode"
                   onkeyup="fetchAddressDetails(this.value)" maxlength="6" required>
            <small class="text-muted">Enter 6-digit pincode to auto-fill city and state</small>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input type="checkbox" id="editDefault" class="form-check-input">
              <label class="form-check-label" for="editDefault">Set as Default Address</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary-custom" onclick="saveEditedAddress()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}" />

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Navbar scroll effect
  window.addEventListener('scroll', function() {
      const navbar = document.getElementById('mainNav');
      if (window.scrollY > 50) {
          navbar.classList.add('scrolled');
      } else {
          navbar.classList.remove('scrolled');
      }
  });

  // ===== TOAST NOTIFICATIONS =====
  function showToast(message, type = 'success') {
      const container = document.querySelector('.toast-container');
      const colors = {
          success: 'bg-success',
          error: 'bg-danger',
          warning: 'bg-warning',
          info: 'bg-info'
      };

      const toast = document.createElement('div');
      toast.className = `toast align-items-center ${colors[type] || colors.info} border-0`;
      toast.role = 'alert';
      toast.innerHTML = `
          <div class="d-flex">
              <div class="toast-body">${message}</div>
              <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
      `;
      container.appendChild(toast);

      const bsToast = new bootstrap.Toast(toast, { delay: 3000 });
      bsToast.show();

      toast.addEventListener('hidden.bs.toast', () => toast.remove());
  }

  // ===== FETCH ADDRESS FROM PINCODE (CHANGED: Added this function) =====
  function fetchAddressDetails(pincode) {
      // Only fetch if pincode is exactly 6 digits
      if (pincode && pincode.length === 6 && /^\d+$/.test(pincode)) {
          showToast('Fetching address details...', 'info');

          fetch(`https://api.postalpincode.in/pincode/${pincode}`)
              .then(response => response.json())
              .then(data => {
                  if (data[0] && data[0].Status === "Success") {
                      const postOffice = data[0].PostOffice[0];
                      // Auto-fill city and state fields
                      document.getElementById('editCity').value = postOffice.District || '';
                      document.getElementById('editState').value = postOffice.State || '';
                      showToast('Address details auto-filled from pincode!', 'success');
                  } else {
                      showToast('Could not fetch address details for this pincode. Please enter manually.', 'warning');
                  }
              })
              .catch(err => {
                  console.error('Error fetching pincode details:', err);
                  showToast('Failed to fetch pincode details. Please enter manually.', 'error');
              });
      }
  }

  // ===== EDIT ADDRESS =====
  function editAddress(addressId) {
      console.log('Editing address ID:', addressId);

      const addressItem = document.querySelector(`.address-item[data-address-id="${addressId}"]`);
      if (!addressItem) {
          showToast('Address not found', 'error');
          return;
      }

      // Extract address details from the displayed text
      const textLines = addressItem.querySelector('p').innerHTML.split('<br>');
      const street = textLines[0].replace('<strong>', '').replace('</strong>', '').trim();
      const cityStatePin = textLines[1] ? textLines[1].trim() : '';
      const cityMatch = cityStatePin.match(/^(.*?),/);
      const statePinMatch = cityStatePin.match(/,\s*(.*?)\s*-\s*(\d+)/);

      const city = cityMatch ? cityMatch[1].trim() : '';
      const state = statePinMatch ? statePinMatch[1].trim() : '';
      const pinCode = statePinMatch ? statePinMatch[2].trim() : '';

      // Check if it's default
      const isDefault = addressItem.querySelector('.address-label .bi-check-circle-fill') !== null;

      // Populate modal fields
      document.getElementById('editAddressId').value = addressId;
      document.getElementById('editStreet').value = street;
      document.getElementById('editCity').value = city;
      document.getElementById('editState').value = state;
      document.getElementById('editPinCode').value = pinCode;
      document.getElementById('editDefault').checked = isDefault;

      // Show modal
      const modal = new bootstrap.Modal(document.getElementById('editAddressModal'));
      modal.show();
  }

  // ===== SAVE EDITED ADDRESS =====
  function saveEditedAddress() {
      const id = document.getElementById('editAddressId').value;
      const payload = {
          street: document.getElementById('editStreet').value.trim(),
          city: document.getElementById('editCity').value.trim(),
          state: document.getElementById('editState').value.trim(),
          pinCode: document.getElementById('editPinCode').value.trim(),
          country: 'India',
          isDefault: document.getElementById('editDefault').checked,
          default: document.getElementById('editDefault').checked
      };

      if (!payload.street || !payload.city || !payload.state || !payload.pinCode) {
          showToast('Please fill in all required fields', 'error');
          return;
      }

      const submitBtn = document.querySelector('#editAddressModal .btn-primary-custom');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Saving...';

      fetch(`/api/user/addresses/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
      })
      .then(r => {
          if (!r.ok) throw new Error('Failed to update address');
          return r.json();
      })
      .then(() => {
          showToast('Address updated successfully!', 'success');
          const modal = bootstrap.Modal.getInstance(document.getElementById('editAddressModal'));
          modal.hide();
          // Reload page to show updated addresses
          location.reload();
      })
      .catch(err => {
          console.error('Error updating address:', err);
          showToast('Failed to update address: ' + err.message, 'error');
      })
      .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Save Changes';
      });
  }

  // ===== DELETE ADDRESS =====
  function deleteAddress(addressId) {
      console.log('Deleting address ID:', addressId);

      if (!confirm('Are you sure you want to delete this address?')) return;

      fetch(`/api/user/addresses/${addressId}`, {
          method: 'DELETE'
      })
      .then(r => {
          if (!r.ok) throw new Error('Failed to delete address');
          return r.json();
      })
      .then(() => {
          showToast('Address deleted successfully!', 'success');
          // Reload page to update the list
          location.reload();
      })
      .catch(err => {
          console.error('Error deleting address:', err);
          showToast('Failed to delete address: ' + err.message, 'error');
      });
  }
</script>
</body>
</html>
