# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/bike_store
spring.datasource.username=anil_user
spring.datasource.password=Anil@1992
spring.datasource.driver-class-name=org.postgresql.Driver

# CRITICAL: Let Flyway manage schema, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false

# Flyway migrations - this will create/update the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Optional: Clean database on startup (use carefully!)
# spring.flyway.clean-disabled=false
# spring.flyway.clean-on-validation-error=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=biswalstores@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Thymeleaf Template Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

