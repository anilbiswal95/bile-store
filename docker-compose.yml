version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bike_store
      POSTGRES_USER: bike_user
      POSTGRES_PASSWORD: bike_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bike_user -d bike_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
